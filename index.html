<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huellitas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="encabezado">
    <h1>Huellitas: Buscador de Perritos</h1>
    <p>Escribe una raza de perro, la que tú quieras! Luego, disfruta mirando fotos de estos hermosos peluditos.</p>
    <img src="imagen/perrito.png">
  </header>

  <section class="busqueda">
    <input
      type="text"
      id="entradaRaza"
      placeholder="Ingresa la raza (husky, beagle, poodle, ...)"
    >
    <button id="botonBuscar">Buscar</button>
  </section>

  <p id="mensaje" class="mensaje"></p>

  <main id="resultados" class="resultados"></main>

  <script src="script.js"></script>
</body>
</html>
